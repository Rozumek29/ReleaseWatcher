<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ReleaseWatcher</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#5865F2" />
    <script>
      // Apply the saved theme and accent before the first paint (PreferencesService keeps them in sync later).
      try {
        var p = JSON.parse(localStorage.getItem('releasewatcher.preferences') || '{}');
        if (typeof p.theme === 'string') document.documentElement.dataset.theme = p.theme;
        if (typeof p.accent === 'string') document.documentElement.dataset.accent = p.accent;
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
