name: Release

# Push a tag to publish a release:
#   v1.2.3 / 1.2.3 -> GitHub Release (zip for Bun + Linux x64 executables as .tar.xz) + Docker image :1.2.3, :1.2 and :latest
#   beta-1.2.3     -> GitHub pre-release + Docker image :beta-1.2.3 (no :latest)
# Executables: linux-x64 (needs a CPU with AVX2), linux-x64-baseline (older x64 CPUs too) and linux-arm64.
# Images: the normal tags are multi-platform (linux/amd64 + linux/arm64); the *-baseline tags (:1.2.3-baseline,
# :latest-baseline …) are linux/amd64 for older x64 CPUs.
# Push the tag only – don't create the release on github.com first: this workflow creates it with the files.
on:
  push:
    tags: ['v*', '[0-9]*', 'beta-*']

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # The Angular CLI (build + Vitest) still runs on Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

      - name: Build release package
        id: pkg
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bun run package "$VERSION"
          cd release
          zip -qr "releasewatcher-$VERSION.zip" "releasewatcher-$VERSION"
          # Each executable is ~110 MB (almost all Bun runtime); xz packs it to ~40 MB for downloads.
          for TARGET in linux-x64 linux-x64-baseline linux-arm64; do
            XZ_OPT='-9 -T0' tar -cJf "releasewatcher-$VERSION-$TARGET.tar.xz" "releasewatcher-$VERSION-$TARGET"
          done
          echo "file=release/releasewatcher-$VERSION.zip" >> "$GITHUB_OUTPUT"
          echo "archive=release/releasewatcher-$VERSION-linux-x64.tar.xz" >> "$GITHUB_OUTPUT"
          echo "baseline=release/releasewatcher-$VERSION-linux-x64-baseline.tar.xz" >> "$GITHUB_OUTPUT"
          echo "arm64=release/releasewatcher-$VERSION-linux-arm64.tar.xz" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          if [[ "$GITHUB_REF_NAME" == beta-* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" "${{ steps.pkg.outputs.file }}" "${{ steps.pkg.outputs.archive }}" "${{ steps.pkg.outputs.baseline }}" "${{ steps.pkg.outputs.arm64 }}" \
            --title "$GITHUB_REF_NAME" --generate-notes $PRERELEASE

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Multi-platform image: x64 with AVX2 (Haswell, 2013, and newer) + arm64; the Dockerfile picks the Bun
          # target from the platform.
          - variant: default
            target: ''
            platforms: linux/amd64,linux/arm64
            suffix: ''
          # Older x64 CPUs – without it Bun crashes with "Illegal instruction".
          - variant: baseline
            target: bun-linux-x64-baseline
            platforms: linux/amd64
            suffix: '-baseline'
    steps:
      - uses: actions/checkout@v4
      # The executable is cross-compiled; only the runtime stage (apt-get) of the arm64 image runs under QEMU.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the name (GHCR requires lowercase)
          images: ${{ env.IMAGE }}
          # The suffix goes on every tag: 1.2.3-baseline, 1.2-baseline, latest-baseline, beta-1.2.3-baseline.
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !startsWith(github.ref_name, 'beta-') }}
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref_name, 'beta-') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            TARGET=${{ matrix.target }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
