name: Release

# Push a tag to publish a release:
#   v1.2.3 / 1.2.3 -> GitHub Release (zip for Bun + Linux x64 executable, also as .tar.xz) + Docker image :1.2.3, :1.2 and :latest
#   beta-1.2.3     -> GitHub pre-release + Docker image :beta-1.2.3 (no :latest)
# Push the tag only – don't create the release on github.com first: this workflow creates it with the files.
on:
  push:
    tags: ['v*', '[0-9]*', 'beta-*']

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # The Angular CLI (build + Vitest) still runs on Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

      - name: Build release package
        id: pkg
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bun run package "$VERSION"
          cd release
          zip -qr "releasewatcher-$VERSION.zip" "releasewatcher-$VERSION"
          # The executable is ~110 MB (almost all Bun runtime); xz packs it to ~40 MB for downloads.
          XZ_OPT='-9 -T0' tar -cJf "releasewatcher-$VERSION-linux-x64.tar.xz" "releasewatcher-$VERSION-linux-x64"
          echo "file=release/releasewatcher-$VERSION.zip" >> "$GITHUB_OUTPUT"
          echo "binary=release/releasewatcher-$VERSION-linux-x64" >> "$GITHUB_OUTPUT"
          echo "archive=release/releasewatcher-$VERSION-linux-x64.tar.xz" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          if [[ "$GITHUB_REF_NAME" == beta-* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" "${{ steps.pkg.outputs.file }}" "${{ steps.pkg.outputs.binary }}" "${{ steps.pkg.outputs.archive }}" \
            --title "$GITHUB_REF_NAME" --generate-notes $PRERELEASE

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the name (GHCR requires lowercase)
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !startsWith(github.ref_name, 'beta-') }}
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref_name, 'beta-') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
